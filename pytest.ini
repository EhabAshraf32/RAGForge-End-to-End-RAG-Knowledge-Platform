[pytest]
testpaths = tests
pythonpath = src
addopts = -ra -p no:cacheprovider
markers =
    integration: needs a local MongoDB (uses a temporary database that is dropped afterwards); skipped if MongoDB is unreachable
    live: calls real external services / downloads real models; skipped unless RUN_LIVE_TESTS=1
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
